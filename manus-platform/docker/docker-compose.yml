version: "3.8"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: manus-platform-backend:latest
    container_name: manus-platform-backend
    # Do not expose backend port publicly; frontend proxies /api and /ws
    networks:
      - manus-platform
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SESSION_WORKSPACE_ROOT=/app/sessions
      - SANDBOX_IMAGE=manus-sandbox:latest
      - SANDBOX_ENABLED=1
      - MAX_ITERATIONS=30
      - TOOL_TIMEOUT=120
      - LLM_TIMEOUT=120
      - LLM_MAX_TOKENS=4096
      - MAX_SUBAGENT_DEPTH=2
      - SUBAGENT_MAX_ITERATIONS=10
    volumes:
      - manus-sessions:/app/sessions
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.openclaw:/root/.openclaw:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: manus-platform-frontend:latest
    container_name: manus-platform-frontend
    ports:
      - "127.0.0.1:8801:80"
    networks:
      - manus-platform
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sandbox-base:
    build:
      context: ../docker/sandbox
      dockerfile: Dockerfile
    image: manus-sandbox:latest
    networks:
      - manus-platform

networks:
  manus-platform:
    name: manus-platform

volumes:
  manus-sessions:
    name: manus-sessions
