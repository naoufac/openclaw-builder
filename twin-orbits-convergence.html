<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twin Orbits: Convergence — city pixel art</title>
  <style>
    :root {
      --void: #0b0d14;
      --sky: #15192b;
      --star: #e8e6f3;
      --star-dim: #6b6f8b;
      --city: #1f2337;
      --city-lit: #3b4264;
      --window: #f4c876;
      --window-dim: #6d5a35;
      --glow-a: #7ee0ff;
      --glow-b: #ff9ecd;
      --ground: #0d0f18;
    }
    html, body { margin: 0; height: 100%; background: var(--void); color: var(--star); }
    body {
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .card {
      width: min(92vw, 720px);
      background: linear-gradient(180deg, #11142a 0%, #0c0e1a 100%);
      border: 1px solid #272b45;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    .canvas {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
      background: var(--sky);
      image-rendering: pixelated;
    }
    .caption {
      padding: 18px 22px;
      line-height: 1.5;
    }
    .caption h1 { margin: 0 0 8px; font-size: 1.05rem; letter-spacing: .04em; color: var(--glow-a); }
    .caption p { margin: 0; font-size: .88rem; color: var(--star-dim); }
  </style>
</head>
<body>
  <main class="card">
    <svg class="canvas" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-label="Pixel city at night with two converging celestial orbs">
      <defs>
        <filter id="glowA" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode /></feMerge>
        </filter>
        <filter id="glowB" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.8" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode /></feMerge>
        </filter>
      </defs>

      <!-- sky -->
      <rect width="320" height="200" fill="#15192b" />

      <!-- stars -->
      <g fill="#e8e6f3">
        <rect x="20" y="18" width="2" height="2" opacity=".7"><animate attributeName="opacity" values=".7;.2;.7" dur="4s" repeatCount="indefinite" /></rect>
        <rect x="50" y="32" width="2" height="2" opacity=".5"><animate attributeName="opacity" values=".5;.9;.5" dur="3.2s" repeatCount="indefinite" /></rect>
        <rect x="90" y="12" width="2" height="2" opacity=".6"><animate attributeName="opacity" values=".6;.2;.6" dur="5s" repeatCount="indefinite" /></rect>
        <rect x="130" y="28" width="2" height="2" opacity=".4"><animate attributeName="opacity" values=".4;.8;.4" dur="2.7s" repeatCount="indefinite" /></rect>
        <rect x="170" y="16" width="2" height="2" opacity=".6"><animate attributeName="opacity" values=".6;.2;.6" dur="4.4s" repeatCount="indefinite" /></rect>
        <rect x="210" y="34" width="2" height="2" opacity=".5"><animate attributeName="opacity" values=".5;.9;.5" dur="3.6s" repeatCount="indefinite" /></rect>
        <rect x="250" y="10" width="2" height="2" opacity=".7"><animate attributeName="opacity" values=".7;.3;.7" dur="4.8s" repeatCount="indefinite" /></rect>
        <rect x="290" y="26" width="2" height="2" opacity=".5"><animate attributeName="opacity" values=".5;.8;.5" dur="3s" repeatCount="indefinite" /></rect>
      </g>

      <!-- distant grid buildings -->
      <g fill="#1f2337">
        <rect x="0" y="120" width="18" height="80" />
        <rect x="18" y="108" width="14" height="92" />
        <rect x="32" y="130" width="16" height="70" />
        <rect x="48" y="96" width="18" height="104" />
        <rect x="66" y="126" width="16" height="74" />
        <rect x="82" y="100" width="14" height="100" />
        <rect x="96" y="118" width="18" height="82" />
        <rect x="114" y="88" width="16" height="112" />
        <rect x="130" y="124" width="18" height="76" />
        <rect x="148" y="106" width="16" height="94" />
        <rect x="164" y="132" width="14" height="68" />
        <rect x="178" y="96" width="18" height="104" />
        <rect x="196" y="120" width="16" height="80" />
        <rect x="212" y="90" width="18" height="110" />
        <rect x="230" y="126" width="14" height="74" />
        <rect x="244" y="104" width="18" height="96" />
        <rect x="262" y="130" width="16" height="70" />
        <rect x="278" y="114" width="18" height="86" />
        <rect x="296" y="98" width="24" height="102" />
      </g>

      <!-- lit windows -->
      <g fill="#f4c876" opacity=".85">
        <rect x="52" y="104" width="4" height="4" />
        <rect x="60" y="114" width="4" height="4" />
        <rect x="54" y="128" width="4" height="4" />
        <rect x="86" y="108" width="4" height="4" />
        <rect x="88" y="124" width="4" height="4" />
        <rect x="100" y="140" width="4" height="4" />
        <rect x="118" y="96" width="4" height="4" />
        <rect x="124" y="112" width="4" height="4" />
        <rect x="134" y="130" width="4" height="4" />
        <rect x="154" y="112" width="4" height="4" />
        <rect x="166" y="102" width="4" height="4" />
        <rect x="182" y="116" width="4" height="4" />
        <rect x="184" y="104" width="4" height="4" />
        <rect x="200" y="126" width="4" height="4" />
        <rect x="216" y="98" width="4" height="4" />
        <rect x="222" y="114" width="4" height="4" />
        <rect x="250" y="110" width="4" height="4" />
        <rect x="252" y="126" width="4" height="4" />
        <rect x="268" y="134" width="4" height="4" />
        <rect x="284" y="120" width="4" height="4" />
      </g>

      <!-- ground -->
      <rect x="0" y="190" width="320" height="10" fill="#0d0f18" />

      <!-- converging orbits -->
      <g fill="none" stroke="#3b4264" stroke-width="1" opacity=".5">
        <ellipse cx="160" cy="62" rx="76" ry="18" transform="rotate(-12 160 62)" />
        <ellipse cx="160" cy="62" rx="76" ry="18" transform="rotate(12 160 62)" />
      </g>

      <!-- orb A -->
      <g filter="url(#glowA)">
        <circle r="8" fill="#7ee0ff">
          <animateMotion path="M 78 48 Q 160 94 242 48" dur="10s" repeatCount="indefinite" rotate="auto" />
        </circle>
        <circle r="5" fill="#b9f1ff">
          <animateMotion path="M 78 48 Q 160 94 242 48" dur="10s" repeatCount="indefinite" rotate="auto" />
        </circle>
      </g>

      <!-- orb B -->
      <g filter="url(#glowB)">
        <circle r="8" fill="#ff9ecd">
          <animateMotion path="M 242 48 Q 160 94 78 48" dur="10s" repeatCount="indefinite" begin="5s" rotate="auto" />
        </circle>
        <circle r="5" fill="#ffe0f0">
          <animateMotion path="M 242 48 Q 160 94 78 48" dur="10s" repeatCount="indefinite" begin="5s" rotate="auto" />
        </circle>
      </g>

      <!-- meeting flash -->
      <circle cx="160" cy="72" r="14" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0;.15;0" dur="10s" repeatCount="indefinite" begin="4.5s" />
      </circle>
    </svg>
    <div class="caption">
      <h1>Twin Orbits: Convergence</h1>
      <p>Two cities orbit the same sky. Their light meets, briefly, above the skyline. Pixel art by Ka, 2026-08-12.</p>
    </div>
  </main>
</body>
</html>
